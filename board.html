<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dark Horse Hoops</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Bebas+Neue&family=JetBrains+Mono:wght@400;500&family=Fraunces:ital,wght@1,500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
  :root{
    --bg:#0a0b0d; --panel:#121319; --ink:#f1ede2; --ink-dim:#94908a;
    --neon:#6bff6b; --gold:#d9a94f; --gold-hi:#f3d68a; --line:rgba(255,255,255,0.07);
    --accent-1:#d9a94f; --accent-2:#6bff6b;
    /* RGB-component versions of the accent colors, kept in sync by applyBranding().
       These exist so gradients/shadows can control alpha (rgba(var(--accent-1-rgb), 0.4))
       while the hex versions above stay the source of truth for solid colors. */
    --accent-1-rgb: 217,169,79;
    --accent-2-rgb: 107,255,107;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:'Oswald',sans-serif;}
  #app{min-height:100vh;}
  .hidden{display:none !important;}
  .view-hidden{display:none !important;}

  #state-screen{
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    text-align:center; padding:32px;
  }
  #state-screen .box{ max-width:420px; }
  #state-screen h1{ font-family:'Bebas Neue',sans-serif; font-size:32px; letter-spacing:1px; margin:0 0 12px; }
  #state-screen p{ color:var(--ink-dim); font-size:15px; line-height:1.6; margin:0; }
  #state-screen .mark{ font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--gold); letter-spacing:2px; text-transform:uppercase; margin-bottom:14px; }

  #header{ padding:56px 24px 28px; text-align:center; background:radial-gradient(circle at 50% 0%,#181a1f 0%,var(--bg) 60%); }
  #header .brand-row{ display:flex; align-items:center; justify-content:center; gap:22px; margin-bottom:28px; }
  #header .brand-row img{ max-height:92px; max-width:300px; object-fit:contain; }
  #header .brand-row .dh-mark{ max-height:56px; max-width:220px; opacity:.85; }
  #header .brand-row .brand-sep{ color:var(--ink-dim); font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:1px; text-transform:uppercase; }
  #header .prepared{ font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:2px; text-transform:uppercase; color:var(--ink-dim); margin-bottom:10px; }
  #header .demo-flag{ display:inline-block; font-family:'JetBrains Mono',monospace; font-size:10.5px; letter-spacing:1px; color:var(--gold-hi); border:1px solid rgba(217,169,79,0.4); padding:3px 10px; border-radius:3px; margin-bottom:14px; }
  #header h1{ font-family:'Bebas Neue',sans-serif; font-size:clamp(30px,6vw,52px); letter-spacing:1px; margin:0 0 8px; }
  #header .sub{ font-family:'JetBrains Mono',monospace; font-size:12px; letter-spacing:1.5px; color: var(--accent-1); text-transform:uppercase; margin-bottom:20px; }
  #header .brief{ max-width:640px; margin:0 auto; color:var(--ink-dim); font-size:15px; line-height:1.7; }
  #header .positions{ margin-top:16px; font-family:'JetBrains Mono',monospace; font-size:11.5px; color:var(--ink-dim); letter-spacing:.5px; }
  #header .positions b{ color:var(--ink); font-weight:500; }

  .view-toggle{ display:flex; justify-content:center; gap:8px; margin:0 0 32px; }
  .view-toggle button{ font-family:'JetBrains Mono',monospace; font-size:12px; letter-spacing:1px; text-transform:uppercase; padding:10px 24px; border-radius:8px; border:1px solid var(--line); background:transparent; color:var(--ink-dim); cursor:pointer; transition:all .25s ease; }
  .view-toggle button.active{ background:linear-gradient(90deg,var(--accent-1),var(--accent-2)); color:#0a0b0d; font-weight:600; border-color:transparent; }
  .view-toggle button:hover:not(.active){ color:var(--ink); border-color:rgba(255,255,255,0.2); }

  #grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:28px; padding:12px 24px 64px; max-width:1240px; margin:0 auto; transition:opacity .25s ease; }

  .card{
    position:relative; border-radius:14px; background:var(--panel);
    border:1px solid var(--line); padding:18px 18px 20px; height:440px;
    display:flex; flex-direction:column; overflow:hidden; cursor:pointer;
    opacity:0; transform:translateY(14px); animation:cardIn .5s ease forwards;
    transition:transform .3s ease, border-color .35s ease, box-shadow .35s ease;
  }
  @keyframes cardIn{ to{ opacity:1; transform:translateY(0);} }
  .card:hover, .card:focus-visible, .card:active{
    transform:translateY(-6px);
    border-color:rgba(var(--accent-1-rgb),0.55);
    box-shadow:0 16px 36px -14px rgba(var(--accent-1-rgb),0.4);
  }
  .card::after{
    content:""; position:absolute; inset:0; pointer-events:none; opacity:.5; mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='0.35'/></svg>");
  }
  .card .gold-edge{ position:absolute; left:0; top:14px; bottom:14px; width:3px; background:linear-gradient(180deg,var(--gold-hi),var(--accent-1) 60%,#8a6a2c); border-radius:0 2px 2px 0; }
  .card .head{ display:flex; justify-content:space-between; align-items:center; font-family:'JetBrains Mono',monospace; font-size:10px; letter-spacing:1.5px; margin-bottom:12px; text-transform:uppercase; color:var(--ink-dim); padding-left:8px; }
  .card .status{ display:flex; align-items:center; gap:6px; }
  .card .dot{ width:6px; height:6px; border-radius:50%; background:var(--accent-2); box-shadow:0 0 8px 1px rgba(107,255,107,0.65); }
  .card .frame{ position:relative; flex:1; margin-left:8px; clip-path:polygon(8% 0%,100% 0%,100% 82%,92% 100%,0% 100%,0% 18%);
    background:repeating-linear-gradient(0deg,rgba(255,255,255,.02) 0,rgba(255,255,255,.02) 1px,transparent 1px,transparent 22px),
               repeating-linear-gradient(90deg,rgba(255,255,255,.02) 0,rgba(255,255,255,.02) 1px,transparent 1px,transparent 22px),
               linear-gradient(160deg,#21242b 0%,#14161a 100%);
    box-shadow:inset 0 0 0 1px rgba(107,255,107,.28); overflow:hidden; }
  .card .frame img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position:center top; }
  .card .frame .silhouette{ position:absolute; bottom:0; left:50%; transform:translateX(-50%); width:70%; height:88%; opacity:.9; }
  .card .frame .silhouette path{ fill:#383b41; }
  .card .scanline{ position:absolute; left:0; right:0; height:2px; top:0; background:var(--accent-2); box-shadow:0 0 10px 2px rgba(107,255,107,.6); animation:sweep 3.6s ease-in-out infinite; }
  @keyframes sweep{ 0%{top:0%;opacity:0;} 8%{opacity:1;} 50%{top:96%;opacity:1;} 58%{opacity:0;} 100%{top:96%;opacity:0;} }
  .card .tag{ position:absolute; top:10px; right:10px; font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:1.5px; padding:3px 8px; border:1px solid rgba(217,169,79,.5); border-radius:3px; transform:rotate(-2deg); background:linear-gradient(160deg,rgba(217,169,79,.12),rgba(217,169,79,.02)); color:var(--gold-hi); }
  .card .reco-badge{ position:absolute; top:10px; left:10px; font-family:'JetBrains Mono',monospace; font-size:10px; letter-spacing:1px; padding:4px 9px; border-radius:3px; background:linear-gradient(120deg,var(--accent-2),var(--accent-1)); color:#0a0b0d; font-weight:700; z-index:2; box-shadow:0 4px 10px -4px rgba(0,0,0,.5); }
  .card .readout{ margin-left:8px; font-family:'JetBrains Mono',monospace; font-size:11.5px; color:var(--ink-dim); line-height:1.85; }
  .card .kicker{ font-family:'Fraunces',serif; font-style:italic; font-size:12px; color:var(--accent-1); letter-spacing:.3px; margin:10px 0 2px; }
  .card .name-line{ font-family:'Oswald',sans-serif; color:var(--ink); font-size:19px; font-weight:600; letter-spacing:.4px; margin-bottom:5px; }
  .card .readout b{ color:var(--ink); font-weight:500; }
  .card .meter{ margin-top:9px; height:4px; border-radius:2px; background:#23262c; overflow:hidden; }
  .card .meter i{ display:block; height:100%; background:linear-gradient(90deg,var(--accent-1),var(--accent-2)); }

  /* ===== COMPARE / HEATMAP VIEW ===== */
  #compare-wrap{ max-width:1240px; margin:0 auto; padding:0 24px 64px; }
  .compare-controls{ display:flex; flex-wrap:wrap; gap:10px; align-items:center; justify-content:space-between; margin-bottom:18px; }
  .chip-row{ display:flex; flex-wrap:wrap; gap:8px; }
  .chip{ font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:.5px; text-transform:uppercase; padding:7px 14px; border-radius:20px; border:1px solid var(--line); background:var(--panel); color:var(--ink-dim); cursor:pointer; user-select:none; }
  .chip.active{ border-color:var(--accent-1); color:var(--gold-hi); background:rgba(217,169,79,0.12); }

  .cmp-table-scroll{ overflow-x:auto; border-radius:12px; border:1px solid var(--line); background:var(--panel); }
  table.cmp{ border-collapse:collapse; width:100%; min-width:640px; }
  table.cmp th, table.cmp td{ padding:11px 16px; text-align:left; white-space:nowrap; }
  table.cmp thead th{ font-family:'JetBrains Mono',monospace; font-size:10.5px; letter-spacing:1px; text-transform:uppercase; color:var(--ink-dim); border-bottom:1px solid var(--line); cursor:pointer; position:sticky; top:0; background:var(--panel); z-index:2; }
  table.cmp thead th:hover{ color:var(--ink); }
  table.cmp thead th.sorted{ color:var(--gold-hi); }
  table.cmp td.identity, table.cmp th.identity{ position:sticky; left:0; background:var(--panel); z-index:3; border-right:1px solid var(--line); }
  table.cmp tbody tr{ cursor:pointer; }
  table.cmp tbody tr:hover td{ filter:brightness(1.08); }
  .cmp-player{ display:flex; align-items:center; gap:10px; min-width:170px; }
  .cmp-player .thumb{ width:34px; height:34px; border-radius:8px; overflow:hidden; background:#21242b; flex-shrink:0; position:relative; }
  .cmp-player .thumb img{ width:100%; height:100%; object-fit:cover; }
  .cmp-player .thumb svg{ position:absolute; bottom:-3px; left:50%; transform:translateX(-50%); width:65%; }
  .cmp-player .thumb svg path{ fill:#3a3d44; }
  .cmp-player .name{ font-family:'Oswald',sans-serif; font-size:13.5px; font-weight:600; color:var(--ink); }
  .cmp-player .sub{ font-family:'JetBrains Mono',monospace; font-size:10px; color:var(--ink-dim); }
  .metric-cell{ font-family:'JetBrains Mono',monospace; font-size:12.5px; border-radius:6px; }
  .metric-cell .dash{ color:var(--ink-dim); }

  .mobile-picker{ display:none; }
  .picker-note{ font-family:'JetBrains Mono',monospace; font-size:10.5px; letter-spacing:.5px; text-transform:uppercase; color:var(--ink-dim); margin-bottom:14px; }
  @media (max-width:720px){
    table.cmp{ display:none; }
    .cmp-table-scroll{ border:none; background:transparent; }
    .mobile-picker{ display:block; }
    .picker-list{ display:flex; flex-direction:column; gap:8px; margin-bottom:6px; }
    .picker-row{ display:flex; align-items:center; gap:12px; padding:12px 14px; border:1px solid var(--line); border-radius:10px; background:var(--panel); cursor:pointer; }
    .picker-row input{ width:18px; height:18px; accent-color:var(--accent-1); flex-shrink:0; }
    .picker-row.disabled{ opacity:.35; }
    .picker-row .name{ font-family:'Oswald',sans-serif; font-size:14px; font-weight:600; color:var(--ink); }
    .picker-row .sub{ font-family:'JetBrains Mono',monospace; font-size:10.5px; color:var(--ink-dim); }
    .stack-card{ border:1px solid var(--line); border-radius:12px; background:var(--panel); padding:16px 18px; margin-bottom:16px; }
    .stack-card .name{ font-family:'Oswald',sans-serif; font-size:17px; font-weight:600; }
    .stack-card .sub{ font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--ink-dim); margin-bottom:10px; }
    .stack-row{ display:flex; justify-content:space-between; padding:7px 0; border-bottom:1px solid var(--line); font-size:13px; }
    .stack-row span{ color:var(--ink-dim); font-family:'JetBrains Mono',monospace; font-size:11px; text-transform:uppercase; letter-spacing:.5px; }
    .stack-row b{ font-family:'JetBrains Mono',monospace; font-weight:500; }
  }

  #dossier-overlay{ position:fixed; inset:0; background:rgba(6,7,8,0.88); backdrop-filter:blur(6px); z-index:50;
    display:flex; align-items:flex-start; justify-content:center; overflow-y:auto; padding:40px 16px; touch-action:pan-y; }
  #dossier-overlay.hidden{ display:none !important; }
  .dossier{ background:var(--panel); border:1px solid var(--line); border-radius:16px; max-width:720px; width:100%;
    padding:28px; position:relative; opacity:0; transform:translateY(18px) scale(.98); animation:dossierIn .35s ease forwards; overflow:hidden; touch-action:none; }
  @keyframes dossierIn{ to{ opacity:1; transform:translateY(0) scale(1); } }
  .dossier .corner-mark{ position:absolute; bottom:14px; right:16px; max-height:26px; max-width:110px; opacity:.55; object-fit:contain; }
  .dossier .close{ position:absolute; top:16px; right:16px; width:32px; height:32px; border-radius:50%; border:1px solid var(--line);
    background:transparent; color:var(--ink-dim); font-size:16px; cursor:pointer; }
  .dossier .back-btn{ position:absolute; top:16px; left:16px; display:flex; align-items:center; gap:6px; font-family:'JetBrains Mono',monospace; font-size:11.5px; letter-spacing:.5px; padding:8px 14px; border-radius:20px; border:1px solid var(--line); background:transparent; color:var(--ink-dim); cursor:pointer; }
  .dossier .back-btn:hover{ color:var(--ink); border-color:rgba(255,255,255,.25); }
  .dossier .top{ display:flex; gap:22px; margin-bottom:20px; margin-top:8px; }
  .dossier .photo{ width:160px; height:200px; border-radius:10px; overflow:hidden; background:linear-gradient(160deg,#21242b,#14161a); flex-shrink:0; position:relative; }
  .dossier .photo img{ width:100%; height:100%; object-fit:cover; }
  .dossier .photo .silhouette{ position:absolute; inset:0; margin:auto; width:70%; height:88%; }
  .dossier .photo .silhouette path{ fill:#383b41; }
  .dossier .photo .headshot-inset{ position:absolute; left:8px; bottom:8px; width:52px; height:52px; border-radius:50%; overflow:hidden; border:2px solid rgba(255,255,255,0.85); box-shadow:0 4px 10px -3px rgba(0,0,0,.6); background:#21242b; }
  .dossier .photo .headshot-inset img{ width:100%; height:100%; object-fit:cover; }
  .dossier h2{ font-family:'Bebas Neue',sans-serif; font-size:32px; letter-spacing:1px; margin:0 0 6px; }
  .dossier .meta{ font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--ink-dim); letter-spacing:.5px; margin-bottom:14px; }
  .dossier .meta b{ color:var(--ink); font-weight:500; }
  .dossier .stat-row{ display:flex; gap:18px; flex-wrap:wrap; }
  .dossier .stat{ font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--ink-dim); }
  .dossier .stat b{ display:block; font-size:18px; color:var(--ink); font-family:'Oswald',sans-serif; font-weight:600; }
  .dossier .ratings-row{ display:flex; gap:10px; flex-wrap:wrap; margin-top:12px; }
  .dossier .rating-chip{ font-family:'JetBrains Mono',monospace; font-size:10.5px; letter-spacing:.5px; text-transform:uppercase; padding:6px 11px; border-radius:20px; border:1px solid var(--line); color:var(--ink-dim); background:rgba(255,255,255,0.02); }
  .dossier .rating-chip b{ color:var(--ink); font-weight:600; margin-left:5px; }
  .dossier .reco-badge{ display:inline-flex; align-items:center; gap:6px; font-family:'JetBrains Mono',monospace; font-size:10.5px; letter-spacing:1px; padding:5px 11px; border-radius:20px; background:linear-gradient(120deg,var(--accent-2),var(--accent-1)); color:#0a0b0d; font-weight:700; margin-bottom:10px; }
  .dossier section{ margin-bottom:16px; }
  .dossier section h3{ font-family:'JetBrains Mono',monospace; font-size:10.5px; letter-spacing:1.5px; text-transform:uppercase; color:var(--accent-1); margin:0 0 6px; }
  .dossier section p{ font-size:14px; line-height:1.65; color:var(--ink); margin:0; }
  .dossier .actions{ display:flex; gap:10px; flex-wrap:wrap; margin-top:20px; }
  .dossier .actions a{ font-family:'JetBrains Mono',monospace; font-size:12px; letter-spacing:.5px; text-decoration:none;
    padding:10px 18px; border-radius:6px; border:1px solid var(--line); color:var(--ink); }
  .dossier .actions a.primary{ background:linear-gradient(90deg,var(--accent-1),var(--accent-2)); color:#0a0b0d; font-weight:600; border:none; }

  @media (max-width:560px){
    .dossier .top{ flex-direction:column; }
    .dossier .photo{ width:100%; height:220px; }
  }
</style>
</head>
<body>

<div id="state-screen" class="hidden"><div class="box">
  <div class="mark" id="state-mark">DARK HORSE HOOPS</div>
  <h1 id="state-title"></h1>
  <p id="state-body"></p>
</div></div>

<div id="app" class="hidden">
  <div id="header"></div>
  <div id="view-toggle" class="view-toggle hidden"></div>
  <div id="grid"></div>
  <div id="compare-wrap" class="view-hidden"></div>
</div>

<div id="dossier-overlay" class="hidden"></div>

<script>
const BRIEF_FIELDS = [
  "Report Title","Team","League","Country","Season","Report Date","Positions Needed",
  "Published Brief","Publish","Branding_Mode","Client Team Name","Prepared By Line",
  "Primary Accent Color (hex)","Secondary Accent Color (hex)","Dark Horse Logo URL",
  "Client Logo URL","Secondary Client Mark URL","Team Photography URL",
  "Arena / Background Image URL","Header / Hero Image URL","Texture / Background Asset URL"
];
// Mirrors the real column order on the "Players - Published" tab (A-AJ) so this list is
// easy to audit against the live sheet. Fit Rating / Level Rating / Top Recommendation Badge /
// Risk Level / Budget Level (cols M-Q) and Stl Rate / Blk Rate / 3pt Attempts per game
// (cols V-X) were added here to match columns Skyler added to the live template.
const PLAYER_FIELDS = [
  "Player ID","Name","Current Team","League","Country","Nationality","Age","Height",
  "Position","Secondary Position","Role","Archetype",
  "Fit Rating","Level Rating","Top Recommendation Badge","Risk Level","Budget Level",
  "PPG","RPG","APG","FG%","Stl Rate","Blk Rate","3pt Attempts per game",
  "Why He's Here","Fit With Brief","Key Strengths","Watch / Concerns",
  "Player Image URL","Player Action Image URL","Player Cutout URL",
  "Film URL","Highlight URL","External Profile URL","Priority","Category"
];

// Compare view's metric list is fixed here in code, on purpose. Each report's Compare view
// only ever shows metrics from this list that actually have a matching column on that
// report's Players - Published data (see usableMetrics) -- older reports made before a
// given column existed just quietly don't show that one metric, nothing breaks.
//
// format: PERCENT / DECIMAL / COUNT / FEET_INCHES / SCALE / CATEGORICAL
//   SCALE is for rating-style columns that may be authored as a number (e.g. 1-10 or
//   0-100) or as a word (Low/Medium/High) -- numericValue() handles both for heat-mapping
//   and sorting, while the real sheet text is always what's actually displayed.
//   CATEGORICAL (Position) gets a stable per-value color tint rather than a high/low heat
//   gradient, since "highest position" isn't a meaningful concept.
// direction: HIGHER_IS_BETTER / LOWER_IS_BETTER / NEUTRAL
const BUILT_IN_METRICS = [
  { key:"Position",              display:"POS",    format:"CATEGORICAL", direction:"NEUTRAL" },
  { key:"Height",                display:"HEIGHT", format:"FEET_INCHES", direction:"NEUTRAL" },
  { key:"Fit Rating",            display:"FIT",     format:"SCALE",      direction:"HIGHER_IS_BETTER" },
  { key:"Level Rating",          display:"LEVEL",   format:"SCALE",      direction:"HIGHER_IS_BETTER" },
  { key:"Risk Level",            display:"RISK",    format:"SCALE",      direction:"LOWER_IS_BETTER" },
  { key:"Budget Level",          display:"BUDGET",  format:"SCALE",      direction:"LOWER_IS_BETTER" },
  { key:"PPG",                   display:"PPG",     format:"DECIMAL",    direction:"HIGHER_IS_BETTER" },
  { key:"RPG",                   display:"RPG",     format:"DECIMAL",    direction:"HIGHER_IS_BETTER" },
  { key:"APG",                   display:"APG",     format:"DECIMAL",    direction:"HIGHER_IS_BETTER" },
  { key:"3pt Attempts per game", display:"3PA",     format:"DECIMAL",    direction:"HIGHER_IS_BETTER" },
  { key:"Stl Rate",              display:"STL",     format:"DECIMAL",    direction:"HIGHER_IS_BETTER" },
  { key:"Blk Rate",              display:"BLK",     format:"DECIMAL",    direction:"HIGHER_IS_BETTER" }
];

const SILHOUETTE_PATH = "M50 8c8 0 14 6 14 14s-6 14-14 14-14-6-14-14 6-14 14-14zm-6 30h12c10 0 18 7 20 17l6 38-14 4-4-26-3 60h-9l-2-46-2 46h-9l-3-60-4 26-14-4 6-38c2-10 10-17 20-17z";
function silhouetteSVG(cls){
  return `<svg class="${cls}" viewBox="0 0 100 160" preserveAspectRatio="xMidYMax meet"><path d="${SILHOUETTE_PATH}"/></svg>`;
}

function decodeBoardId(id){
  const b64 = id.replace(/-/g,"+").replace(/_/g,"/");
  const padded = b64 + "===".slice((b64.length + 3) % 4);
  const raw = atob(padded);
  const parts = raw.split("|");
  if(parts.length !== 3) throw new Error("Malformed board id");
  const [rawKey, briefGid, playersGid] = parts;
  if(!rawKey || !briefGid || !playersGid) throw new Error("Malformed board id");
  // rawKey is either "N:<spreadsheetId>" (normal Sheets link), "P:<publishKey>"
  // ("Publish to web" link), or -- for board links generated before this
  // distinction existed -- a bare publish key with no prefix at all.
  const typeMatch = rawKey.match(/^([NP]):(.+)$/);
  const type = typeMatch ? typeMatch[1] : "P";
  const key = typeMatch ? typeMatch[2] : rawKey;
  if(!key) throw new Error("Malformed board id");
  return { type, key, briefGid, playersGid };
}
function csvUrl(type, key, gid){
  if(type === "N"){
    return `https://docs.google.com/spreadsheets/d/${key}/export?format=csv&gid=${gid}`;
  }
  return `https://docs.google.com/spreadsheets/d/e/${key}/pub?gid=${gid}&single=true&output=csv`;
}

function fetchCsvRows(url){
  return fetch(url, { cache: "no-store" }).then(function(res){
    if(!res.ok) throw new Error("CSV fetch failed: " + res.status);
    return res.text();
  }).then(function(text){
    return new Promise(function(resolve){
      Papa.parse(text, { complete: function(r){ resolve(r.data); } });
    });
  });
}

function parseBrief(rows){
  const lookup = {};
  rows.forEach(function(row){
    if(row && row[0]) lookup[String(row[0]).trim()] = row[1] !== undefined ? String(row[1]).trim() : "";
  });
  const brief = {};
  BRIEF_FIELDS.forEach(function(f){ brief[f] = lookup[f] || ""; });
  return brief;
}

function parsePlayers(rows){
  if(!rows.length) return [];
  const header = rows[0].map(function(h){ return String(h || "").trim(); });
  const out = [];
  for(let i = 1; i < rows.length; i++){
    const row = rows[i];
    if(!row || row.every(function(c){ return !c; })) continue;
    const obj = {};
    header.forEach(function(h, idx){ obj[h] = row[idx] !== undefined ? row[idx] : ""; });
    if(!obj["Name"]) continue;
    const player = {};
    PLAYER_FIELDS.forEach(function(f){ player[f] = obj[f] || ""; });
    out.push(player);
  }
  return out;
}

function usableMetrics(metricDefs, players){
  if(!players.length) return [];
  const cols = {};
  Object.keys(players[0]).forEach(function(k){ cols[k] = true; });
  return metricDefs.filter(function(m){ return cols[m.key]; });
}

function parseFeetInches(str){
  if(str === undefined || str === null || String(str).trim() === "") return null;
  const s = String(str).trim();
  const m = s.match(/(\d+)\s*'\s*(\d+(?:\.\d+)?)/);
  if(m) return parseInt(m[1],10) * 12 + parseFloat(m[2]);
  const n = parseFloat(s);
  return isNaN(n) ? null : n;
}

function numericValue(raw, format){
  if(raw === undefined || raw === null || String(raw).trim() === "") return null;
  const s = String(raw).trim();
  if(format === "FEET_INCHES") return parseFeetInches(s);
  if(format === "PERCENT"){
    const n = parseFloat(s.replace(/%/g,""));
    if(isNaN(n)) return null;
    return n <= 1 ? n * 100 : n;
  }
  if(format === "SCALE"){
    // Rating-style columns (Fit / Level / Risk / Budget) may be authored as a plain
    // number (any scale) or as a word -- try numeric first, then fall back to a
    // rough word mapping so heat-mapping and sorting still work either way. The
    // literal sheet text is always what's actually shown to the user (displayValue).
    const n = parseFloat(s.replace(/,/g,""));
    if(!isNaN(n)) return n;
    const word = s.toLowerCase().replace(/[^a-z/]/g,"");
    if(/^(verylow|low|l)$/.test(word)) return 15;
    if(/^(medium|mid|moderate|m)$/.test(word)) return 50;
    if(/^(veryhigh|high|h)$/.test(word)) return 85;
    if(/^(elite|premium|max|maximum)$/.test(word)) return 100;
    if(/^(none|na)$/.test(word)) return 0;
    return null;
  }
  const n = parseFloat(s.replace(/,/g,""));
  return isNaN(n) ? null : n;
}

function displayValue(raw, format){
  if(raw === undefined || raw === null || String(raw).trim() === "") return "—";
  const s = String(raw).trim();
  if(format === "PERCENT"){
    const n = numericValue(raw, format);
    return n === null ? "—" : (Math.round(n * 10) / 10) + "%";
  }
  if(format === "FEET_INCHES") return s;
  if(format === "COUNT"){
    const n = parseFloat(s);
    return isNaN(n) ? s : String(Math.round(n));
  }
  if(format === "DECIMAL"){
    const n = parseFloat(s);
    return isNaN(n) ? s : String(Math.round(n * 10) / 10);
  }
  // SCALE and CATEGORICAL both just show the sheet's literal text.
  return s;
}

function uniquePositions(players){
  const seen = [];
  players.forEach(function(p){
    const v = String(p["Position"] || "").trim();
    if(v && seen.indexOf(v) === -1) seen.push(v);
  });
  return seen;
}

// Deterministic per-value color tint for categorical columns (Position) -- gives every
// distinct value a stable shade so the heatmap table still reads as "colored in", without
// implying that one position is numerically better than another.
function categoricalIntensity(value){
  const s = String(value || "").trim();
  if(!s) return null;
  let hash = 0;
  for(let i = 0; i < s.length; i++){ hash = (hash * 31 + s.charCodeAt(i)) >>> 0; }
  const steps = [0.14, 0.22, 0.30, 0.38, 0.46];
  return steps[hash % steps.length];
}

function computeIntensities(players, metric){
  if(metric.format === "CATEGORICAL"){
    return players.map(function(p){ return categoricalIntensity(p[metric.key]); });
  }
  const vals = players.map(function(p){ return numericValue(p[metric.key], metric.format); });
  if(metric.direction === "NEUTRAL") return vals.map(function(){ return null; });
  const nums = vals.filter(function(v){ return v !== null; });
  if(!nums.length) return vals.map(function(){ return null; });
  const min = Math.min.apply(null, nums), max = Math.max.apply(null, nums);
  return vals.map(function(v){
    if(v === null) return null;
    if(max === min) return 0.5;
    let t = (v - min) / (max - min);
    if(metric.direction === "LOWER_IS_BETTER") t = 1 - t;
    return t;
  });
}

function intensityStyle(t){
  if(t === null || t === undefined) return "";
  const alpha = 0.12 + t * 0.55;
  // References the live --accent-1-rgb / --accent-2-rgb custom properties rather than
  // fixed colors, so the heatmap quietly picks up whatever team colors are currently
  // active (set by applyBranding) without this function needing to know about them.
  return `background:linear-gradient(90deg, rgba(var(--accent-1-rgb),${alpha.toFixed(2)}), rgba(var(--accent-2-rgb),${(alpha*0.9).toFixed(2)}));`;
}

function showState(mark, title, body){
  document.getElementById("app").classList.add("hidden");
  const s = document.getElementById("state-screen");
  s.classList.remove("hidden");
  document.getElementById("state-mark").textContent = mark;
  document.getElementById("state-title").textContent = title;
  document.getElementById("state-body").textContent = body;
}

function hexToRgbString(hex){
  const m = /^#([0-9a-fA-F]{2})([0-9a-fA-F]{2})([0-9a-fA-F]{2})$/.exec(hex);
  if(!m) return null;
  return [parseInt(m[1],16), parseInt(m[2],16), parseInt(m[3],16)].join(",");
}

function applyBranding(brief){
  const root = document.documentElement.style;
  if(brief["Branding_Mode"] === "CLIENT"){
    const p = brief["Primary Accent Color (hex)"];
    const s = brief["Secondary Accent Color (hex)"];
    if(/^#[0-9a-fA-F]{6}$/.test(p)){
      root.setProperty("--accent-1", p);
      root.setProperty("--accent-1-rgb", hexToRgbString(p));
    }
    if(/^#[0-9a-fA-F]{6}$/.test(s)){
      root.setProperty("--accent-2", s);
      root.setProperty("--accent-2-rgb", hexToRgbString(s));
    }
  }
}

function isLikelyImageUrl(val){
  if(!val) return false;
  return /^https?:\/\//i.test(String(val).trim());
}

function pickImage(player, keys){
  for(const k of keys){ if(isLikelyImageUrl(player[k])) return player[k].trim(); }
  return null;
}

function handleImgError(img, cls){
  img.outerHTML = silhouetteSVG(cls || "");
}

// Fit Rating drives the card meter bar. Gemini may end up authoring it on a 0-100 scale
// (matching the internal League Leveling reference tab) or a simpler 1-10 scale -- this
// normalizes either convention into a 0-100 fill percentage. Falls back to null (caller
// then falls back to the old PPG-based estimate) if Fit Rating isn't populated yet.
function fitRatingPercent(player){
  const raw = numericValue(player["Fit Rating"], "SCALE");
  if(raw === null) return null;
  const pct = raw <= 10 ? raw * 10 : raw;
  return Math.min(100, Math.max(0, Math.round(pct)));
}

// Shared client-branding state for this board, computed once per load and
// reused by the header logo row and the player dossier's corner mark --
// so both stay in sync without recomputing/duplicating the same logic.
let BRAND = { clientLogo: null, secondaryMark: null };

function computeBrand(brief){
  const isClientBranded = brief["Branding_Mode"] === "CLIENT";
  return {
    clientLogo: isClientBranded && isLikelyImageUrl(brief["Client Logo URL"]) ? brief["Client Logo URL"].trim() : null,
    secondaryMark: isClientBranded && isLikelyImageUrl(brief["Secondary Client Mark URL"]) ? brief["Secondary Client Mark URL"].trim() : null
  };
}

function renderHeader(brief, opts){
  const el = document.getElementById("header");
  const demo = opts && opts.demo;

  const dhLogo = isLikelyImageUrl(brief["Dark Horse Logo URL"]) ? brief["Dark Horse Logo URL"].trim() : null;
  const showBrandRow = !!BRAND.clientLogo;

  el.innerHTML = `
    ${demo ? '<div class="demo-flag">DEMO PREVIEW &mdash; NO LIVE SHEET LOADED</div><br>' : ''}
    ${showBrandRow ? `
      <div class="brand-row">
        <img src="${BRAND.clientLogo}" alt="" onerror="this.parentElement.remove()">
        ${dhLogo ? `<span class="brand-sep">&times;</span><img class="dh-mark" src="${dhLogo}" alt="" onerror="this.remove()">` : ""}
      </div>
    ` : ""}
    <div class="prepared">${brief["Prepared By Line"] || "Prepared by Dark Horse Hoops"}</div>
    <h1>${brief["Report Title"] || "Dark Horse Sourcing Board"}</h1>
    <div class="sub">${[brief["Team"], brief["League"], brief["Country"], brief["Season"]].filter(Boolean).join(" &middot; ")}</div>
    <div class="brief">${brief["Published Brief"] || ""}</div>
    ${brief["Positions Needed"] ? `<div class="positions">TARGETING &nbsp;<b>${brief["Positions Needed"]}</b></div>` : ""}
  `;
}

function renderCard(player, index){
  const div = document.createElement("div");
  div.className = "card";
  div.style.animationDelay = (index * 70) + "ms";
  // Action shot is the primary card image now; cutout and plain headshot are fallbacks
  // in that order if no action shot is on file for this player.
  const imgUrl = pickImage(player, ["Player Action Image URL","Player Cutout URL","Player Image URL"]);
  const isTopReco = String(player["Top Recommendation Badge"] || "").trim().toUpperCase() === "YES";
  const fitPct = fitRatingPercent(player);
  const meterPct = fitPct !== null ? fitPct : Math.min(100, Math.max(8, Number(player["PPG"]) * 5 || 30));
  div.innerHTML = `
    <div class="gold-edge"></div>
    <div class="head"><span>DH &middot; ${String(player["Player ID"] || (index+1)).toUpperCase()}</span>
      <span class="status"><span class="dot"></span>ACTIVE</span></div>
    <div class="frame">
      ${imgUrl ? `<img src="${imgUrl}" alt="" onerror="handleImgError(this, 'silhouette')">` : silhouetteSVG("silhouette")}
      <div class="scanline"></div>
      ${isTopReco ? `<div class="reco-badge">&#9733; TOP PICK</div>` : ""}
      <div class="tag">${player["Priority"] || "-"}</div>
    </div>
    <div class="kicker">${player["Role"] || player["Archetype"] || ""}</div>
    <div class="readout">
      <div class="name-line">${player["Name"]}</div>
      <div>POS <b>${player["Position"] || "-"}</b> &nbsp; HT <b>${player["Height"] || "-"}</b> &nbsp; AGE <b>${player["Age"] || "-"}</b></div>
      <div>TEAM <b>${player["Current Team"] || "-"}</b>${player["League"] ? ", " + player["League"] : ""}</div>
      <div class="meter"><i style="width:${meterPct}%"></i></div>
    </div>
  `;
  div.addEventListener("click", function(){ openDossier(player, ALL_PLAYERS, index); });
  return div;
}

// ===== state for the Compare view =====
let ALL_PLAYERS = [];
let METRIC_DEFS = [];
let VIEW = "cards";
let CURRENT_POSITION = "ALL";
let SORT_KEY = null;
let SORT_DIR = "desc";
let MOBILE_SELECTED = new Set();

function renderViewToggle(hasCompare){
  const el = document.getElementById("view-toggle");
  if(!hasCompare){ el.classList.add("hidden"); el.innerHTML = ""; return; }
  el.classList.remove("hidden");
  el.innerHTML = `
    <button data-view="cards" class="${VIEW === 'cards' ? 'active' : ''}">Cards</button>
    <button data-view="compare" class="${VIEW === 'compare' ? 'active' : ''}">Compare</button>
  `;
  el.querySelectorAll("button").forEach(function(btn){
    btn.addEventListener("click", function(){ setView(btn.dataset.view); });
  });
}

function setView(v){
  VIEW = v;
  document.getElementById("grid").classList.toggle("view-hidden", v !== "cards");
  document.getElementById("compare-wrap").classList.toggle("view-hidden", v !== "compare");
  document.querySelectorAll("#view-toggle button").forEach(function(b){
    b.classList.toggle("active", b.dataset.view === v);
  });
  if(v === "compare") renderCompare();
}

function filteredPlayers(){
  if(CURRENT_POSITION === "ALL") return ALL_PLAYERS;
  return ALL_PLAYERS.filter(function(p){ return String(p["Position"] || "").trim() === CURRENT_POSITION; });
}

function sortedIndices(players, metrics){
  const idxs = players.map(function(_, i){ return i; });
  if(!SORT_KEY) return idxs;
  const metric = metrics.filter(function(m){ return m.key === SORT_KEY; })[0];
  if(!metric) return idxs;
  return idxs.slice().sort(function(a, b){
    const va = numericValue(players[a][SORT_KEY], metric.format);
    const vb = numericValue(players[b][SORT_KEY], metric.format);
    if(va === null && vb === null) return 0;
    if(va === null) return 1;
    if(vb === null) return -1;
    return SORT_DIR === "desc" ? vb - va : va - vb;
  });
}

function renderCompareRows(players, metrics){
  const order = sortedIndices(players, metrics);
  const intensityMap = {};
  metrics.forEach(function(m){ intensityMap[m.key] = computeIntensities(players, m); });
  return order.map(function(i){
    const p = players[i];
    const imgUrl = pickImage(p, ["Player Action Image URL","Player Cutout URL","Player Image URL"]);
    const cells = metrics.map(function(m){
      const t = intensityMap[m.key][i];
      const dv = displayValue(p[m.key], m.format);
      return `<td class="metric-cell" style="${intensityStyle(t)}"><span class="${dv === '—' ? 'dash' : ''}">${dv}</span></td>`;
    }).join("");
    return `
      <tr data-idx="${i}">
        <td class="identity">
          <div class="cmp-player">
            <div class="thumb">${imgUrl ? `<img src="${imgUrl}" onerror="handleImgError(this, '')">` : silhouetteSVG("")}</div>
            <div>
              <div class="name">${p["Name"]}</div>
              <div class="sub">${[p["Position"], p["Current Team"]].filter(Boolean).join(" &middot; ")}</div>
            </div>
          </div>
        </td>
        ${cells}
      </tr>
    `;
  }).join("");
}

function renderMobilePicker(players, metrics){
  if(!MOBILE_SELECTED.size){
    players.slice(0, 3).forEach(function(_, i){ MOBILE_SELECTED.add(i); });
  }
  const list = players.map(function(p, i){
    const checked = MOBILE_SELECTED.has(i);
    const disabled = !checked && MOBILE_SELECTED.size >= 4;
    return `
      <label class="picker-row ${disabled ? 'disabled' : ''}">
        <input type="checkbox" data-idx="${i}" ${checked ? 'checked' : ''} ${disabled ? 'disabled' : ''}>
        <div>
          <div class="name">${p["Name"]}</div>
          <div class="sub">${[p["Position"], p["Current Team"]].filter(Boolean).join(" &middot; ")}</div>
        </div>
      </label>
    `;
  }).join("");

  const selectedIdxs = players.map(function(_, i){ return i; }).filter(function(i){ return MOBILE_SELECTED.has(i); });
  const stacks = selectedIdxs.map(function(i){
    const p = players[i];
    const rows = metrics.map(function(m){
      return `<div class="stack-row"><span>${m.display}</span><b>${displayValue(p[m.key], m.format)}</b></div>`;
    }).join("");
    return `
      <div class="stack-card" data-idx="${i}">
        <div class="name">${p["Name"]}</div>
        <div class="sub">${[p["Position"], p["Current Team"]].filter(Boolean).join(" &middot; ")}</div>
        ${rows}
      </div>
    `;
  }).join("");

  return `
    <div class="picker-note">Select up to 4 players to compare</div>
    <div class="picker-list">${list}</div>
    ${stacks}
  `;
}

function wireMobilePicker(players){
  document.querySelectorAll(".picker-row input").forEach(function(input){
    input.addEventListener("change", function(){
      const idx = Number(input.dataset.idx);
      if(input.checked) MOBILE_SELECTED.add(idx); else MOBILE_SELECTED.delete(idx);
      renderCompare();
    });
  });
  document.querySelectorAll(".stack-card").forEach(function(card){
    card.addEventListener("click", function(){
      const idx = Number(card.dataset.idx);
      openDossier(players[idx], players, idx);
    });
  });
}

// Compare is now one full heatmap table -- every built-in metric that this report's data
// supports is always shown as its own column, all at once. (There used to be a set of
// category tabs splitting the columns up one group at a time; that's gone by design, per
// explicit feedback that it felt like a filtered list rather than a real comparison table.)
// The position chips remain as a row filter (which players are shown), which is a
// different thing from column filtering and stays useful on boards with a lot of players.
function renderCompare(){
  const wrap = document.getElementById("compare-wrap");
  const metrics = METRIC_DEFS;
  const positions = uniquePositions(ALL_PLAYERS);
  const players = filteredPlayers();

  wrap.innerHTML = `
    <div class="compare-controls">
      <div class="chip-row" id="position-chips">
        <span class="chip ${CURRENT_POSITION === 'ALL' ? 'active' : ''}" data-pos="ALL">All</span>
        ${positions.map(function(p){ return `<span class="chip ${CURRENT_POSITION === p ? 'active' : ''}" data-pos="${p}">${p}</span>`; }).join("")}
      </div>
    </div>
    <div class="cmp-table-scroll">
      <table class="cmp">
        <thead><tr>
          <th class="identity">Player</th>
          ${metrics.map(function(m){ return `<th data-key="${m.key}" class="${SORT_KEY === m.key ? 'sorted' : ''}">${m.display}</th>`; }).join("")}
        </tr></thead>
        <tbody>${renderCompareRows(players, metrics)}</tbody>
      </table>
    </div>
    <div class="mobile-picker">${renderMobilePicker(players, metrics)}</div>
  `;

  wrap.querySelectorAll("#position-chips .chip").forEach(function(chip){
    chip.addEventListener("click", function(){ CURRENT_POSITION = chip.dataset.pos; renderCompare(); });
  });
  wrap.querySelectorAll("table.cmp thead th[data-key]").forEach(function(th){
    th.addEventListener("click", function(){
      const key = th.dataset.key;
      if(SORT_KEY === key){ SORT_DIR = SORT_DIR === "desc" ? "asc" : "desc"; }
      else { SORT_KEY = key; SORT_DIR = "desc"; }
      renderCompare();
    });
  });
  wrap.querySelectorAll("table.cmp tbody tr[data-idx]").forEach(function(tr){
    tr.addEventListener("click", function(){
      const idx = Number(tr.dataset.idx);
      openDossier(players[idx], players, idx);
    });
  });
  wireMobilePicker(players);
}

function renderBoard(brief, players, opts){
  document.getElementById("state-screen").classList.add("hidden");
  document.getElementById("app").classList.remove("hidden");
  BRAND = computeBrand(brief);
  renderHeader(brief, opts);
  const grid = document.getElementById("grid");
  grid.innerHTML = "";
  players.forEach(function(p, i){ grid.appendChild(renderCard(p, i)); });

  VIEW = "cards";
  CURRENT_POSITION = "ALL";
  // Compare view defaults to best-Fit-Rating-first; falls back gracefully (no sort) on
  // older reports that don't have a Fit Rating column yet.
  SORT_KEY = "Fit Rating";
  SORT_DIR = "desc";
  MOBILE_SELECTED = new Set();
  grid.classList.remove("view-hidden");
  document.getElementById("compare-wrap").classList.add("view-hidden");
  renderViewToggle(METRIC_DEFS.length > 0);
}

function actionLink(label, url, primary){
  if(!url) return "";
  return `<a href="${url}" target="_blank" rel="noopener" class="${primary ? 'primary' : ''}">${label}</a>`;
}

// ===== dossier navigation state (back button + swipe left/right/down) =====
let DOSSIER_LIST = [];
let DOSSIER_INDEX = -1;

function navigateDossier(delta){
  if(DOSSIER_INDEX === -1 || !DOSSIER_LIST.length) return;
  const next = DOSSIER_INDEX + delta;
  if(next < 0 || next >= DOSSIER_LIST.length) return;
  openDossier(DOSSIER_LIST[next], DOSSIER_LIST, next);
}

function openDossier(player, list, index){
  // list/index let the caller say "this player, within this ordered set" (Cards grid,
  // filtered Compare rows, mobile stack) so swiping/back navigation moves through whatever
  // the person was actually looking at. Falls back to the full player list if not given.
  DOSSIER_LIST = (list && list.length) ? list : ALL_PLAYERS;
  DOSSIER_INDEX = typeof index === "number" ? index : DOSSIER_LIST.indexOf(player);

  const overlay = document.getElementById("dossier-overlay");
  // Action/cutout shot stays the primary "hero" photo; the plain headshot (if different
  // from the hero shot) is layered in as a small, subtle corner inset -- present, not distracting.
  const imgUrl = pickImage(player, ["Player Action Image URL","Player Cutout URL","Player Image URL"]);
  const headshotUrl = isLikelyImageUrl(player["Player Image URL"]) ? player["Player Image URL"].trim() : null;
  const showHeadshotInset = headshotUrl && headshotUrl !== imgUrl;
  const cornerMark = BRAND.clientLogo || BRAND.secondaryMark;
  const isTopReco = String(player["Top Recommendation Badge"] || "").trim().toUpperCase() === "YES";

  const ratingChips = [
    player["Fit Rating"] ? `<div class="rating-chip">Fit<b>${player["Fit Rating"]}</b></div>` : "",
    player["Level Rating"] ? `<div class="rating-chip">Level<b>${player["Level Rating"]}</b></div>` : "",
    player["Risk Level"] ? `<div class="rating-chip">Risk<b>${player["Risk Level"]}</b></div>` : "",
    player["Budget Level"] ? `<div class="rating-chip">Budget<b>${player["Budget Level"]}</b></div>` : ""
  ].filter(Boolean).join("");

  overlay.innerHTML = `
    <div class="dossier">
      ${cornerMark ? `<img class="corner-mark" src="${cornerMark}" alt="" onerror="this.remove()">` : ""}
      <button class="back-btn" onclick="closeDossier()">&lsaquo; Back to players</button>
      <button class="close" onclick="closeDossier()">&times;</button>
      <div class="top">
        <div class="photo">
          ${imgUrl ? `<img src="${imgUrl}" alt="" onerror="handleImgError(this, 'silhouette')">` : silhouetteSVG("silhouette")}
          ${showHeadshotInset ? `<div class="headshot-inset"><img src="${headshotUrl}" alt="" onerror="this.parentElement.remove()"></div>` : ""}
        </div>
        <div>
          ${isTopReco ? `<div class="reco-badge">&#9733; TOP RECOMMENDATION</div>` : ""}
          <h2>${player["Name"]}</h2>
          <div class="meta">${[player["Position"], player["Height"], player["Age"] ? "Age " + player["Age"] : "", player["Current Team"], player["League"]].filter(Boolean).join(" &middot; ")}</div>
          <div class="stat-row">
            ${player["PPG"] ? `<div class="stat"><b>${player["PPG"]}</b>PPG</div>` : ""}
            ${player["RPG"] ? `<div class="stat"><b>${player["RPG"]}</b>RPG</div>` : ""}
            ${player["APG"] ? `<div class="stat"><b>${player["APG"]}</b>APG</div>` : ""}
            ${player["FG%"] ? `<div class="stat"><b>${player["FG%"]}</b>FG%</div>` : ""}
          </div>
          ${ratingChips ? `<div class="ratings-row">${ratingChips}</div>` : ""}
        </div>
      </div>
      ${player["Why He's Here"] ? `<section><h3>Why he's here</h3><p>${player["Why He's Here"]}</p></section>` : ""}
      ${player["Fit With Brief"] ? `<section><h3>Fit with the brief</h3><p>${player["Fit With Brief"]}</p></section>` : ""}
      ${player["Key Strengths"] ? `<section><h3>Key strengths</h3><p>${player["Key Strengths"]}</p></section>` : ""}
      ${player["Watch / Concerns"] ? `<section><h3>Watch / concerns</h3><p>${player["Watch / Concerns"]}</p></section>` : ""}
      <div class="actions">
        ${actionLink("Watch film", player["Film URL"], true)}
        ${actionLink("Highlights", player["Highlight URL"], false)}
        ${actionLink("External profile", player["External Profile URL"], false)}
      </div>
    </div>
  `;
  overlay.classList.remove("hidden");
}
function closeDossier(){ document.getElementById("dossier-overlay").classList.add("hidden"); }
document.getElementById("dossier-overlay").addEventListener("click", function(e){
  if(e.target.id === "dossier-overlay") closeDossier();
});

// Swipe/drag gestures on the open dossier: swipe (or click-drag) left/right moves to the
// adjacent player within whatever list the dossier was opened from; swiping down closes it.
// Wired once on the stable overlay element (delegated via closest(".dossier") at drag-start)
// rather than re-wired on every render.
(function wireDossierGestures(){
  const overlay = document.getElementById("dossier-overlay");
  let dragState = null;
  overlay.addEventListener("pointerdown", function(e){
    const card = e.target.closest(".dossier");
    if(!card) return;
    dragState = { startX: e.clientX, startY: e.clientY };
  });
  overlay.addEventListener("pointerup", function(e){
    if(!dragState) return;
    const dx = e.clientX - dragState.startX;
    const dy = e.clientY - dragState.startY;
    dragState = null;
    const absX = Math.abs(dx), absY = Math.abs(dy);
    const THRESH = 70;
    if(absY > absX && dy > THRESH){ closeDossier(); return; }
    if(absX > absY && absX > THRESH){ navigateDossier(dx < 0 ? 1 : -1); }
  });
  overlay.addEventListener("pointerleave", function(){ dragState = null; });
})();
